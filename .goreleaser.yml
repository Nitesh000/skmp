version: 2
project_name: skmp

builds:
  - id: skmp
    dir: skmp
    binary: skmp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "skmp-{{ .Os }}-{{ .Arch }}"

release:
  github:
    owner: Nitesh000
    name: skmp

brews:
  - repository:
      owner: Nitesh000
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Nitesh000/skmp"
    description: "Skill marketplace for AI agent skills"
    license: "MIT"
    test: |
      system "#{bin}/skmp version"
