name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Needed for GoReleaser to create the GitHub Release
  id-token: write # Recommended for npm provenance

jobs:
  goreleaser:
    name: Build & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the git history & tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "skmp/go.mod"
          cache-dependency-path: "skmp/go.sum"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  npm-publish:
    name: Publish NPM Package
    needs: goreleaser # MUST wait for GoReleaser so the binaries are available for download!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from git tag
        working-directory: ./npm
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version

      - name: Publish to NPM
        working-directory: ./npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
